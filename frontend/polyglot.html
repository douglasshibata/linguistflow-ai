<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyglot — AI-Powered Language Learning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0b09; --bg2: #141310; --card: #1c1b17; --card2: #242320;
    --fg: #f2ece0; --fg2: #c8c0b2; --muted: #7a7468;
    --accent: #e8a838; --accent2: #d4763a; --accent3: #4ea87a;
    --border: #2e2d28; --danger: #d44a4a; --success: #4ea87a;
    --ai: #c084fc; --ai-bg: rgba(192,132,252,0.08); --ai-border: rgba(192,132,252,0.2);
    --game: #4ea8d6; --game-bg: rgba(78,168,214,0.08); --game-border: rgba(78,168,214,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow-x: hidden; }
  h1,h2,h3,h4,h5 { font-family: 'Playfair Display', serif; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .bg-glow { position: fixed; top: -200px; right: -200px; width: 600px; height: 600px; background: radial-gradient(circle, rgba(232,168,56,0.06) 0%, transparent 70%); pointer-events: none; z-index: 0; }
  .bg-glow2 { position: fixed; bottom: -300px; left: -200px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(192,132,252,0.04) 0%, transparent 70%); pointer-events: none; z-index: 0; }

  .lang-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; cursor: pointer; transition: all 0.35s cubic-bezier(0.4,0,0.2,1); position: relative; overflow: hidden; }
  .lang-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform: scaleX(0); transform-origin: left; transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
  .lang-card:hover::before { transform: scaleX(1); }
  .lang-card:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 60px rgba(232,168,56,0.06); }

  .module-btn { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-radius: 10px; cursor: pointer; transition: all 0.25s; color: var(--fg2); font-size: 13px; font-weight: 500; border: 1px solid transparent; width: 100%; text-align: left; background: none; }
  .module-btn:hover { background: var(--card2); color: var(--fg); }
  .module-btn.active { background: rgba(232,168,56,0.1); color: var(--accent); border-color: rgba(232,168,56,0.2); }
  .module-btn.ai-mod.active { background: var(--ai-bg); color: var(--ai); border-color: var(--ai-border); }
  .module-btn i { width: 18px; text-align: center; font-size: 14px; }

  .content-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 16px; transition: border-color 0.3s; }
  .vocab-card { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; cursor: pointer; }
  .vocab-card:hover { border-color: var(--accent); background: rgba(232,168,56,0.05); transform: translateX(4px); }

  .speak-btn { width: 38px; height: 38px; border-radius: 50%; background: rgba(232,168,56,0.15); border: 1px solid rgba(232,168,56,0.3); color: var(--accent); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.25s; flex-shrink: 0; }
  .speak-btn:hover { background: var(--accent); color: var(--bg); transform: scale(1.1); }
  .speak-btn.speaking { animation: pulse-speak 0.8s ease-in-out infinite; }
  .speak-btn.recording { background: var(--danger); color: white; border-color: var(--danger); animation: pulse-danger 0.8s ease-in-out infinite; }

  @keyframes pulse-speak { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,168,56,0.4); } 50% { box-shadow: 0 0 0 12px rgba(232,168,56,0); } }
  @keyframes pulse-danger { 0%, 100% { box-shadow: 0 0 0 0 rgba(212,74,74,0.4); } 50% { box-shadow: 0 0 0 12px rgba(212,74,74,0); } }

  .grammar-rule { background: var(--card2); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 20px 24px; margin-bottom: 14px; }
  .phrase-part { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 8px; margin: 3px; font-size: 15px; }
  .dialogue-bubble { max-width: 80%; padding: 14px 18px; border-radius: 16px; margin-bottom: 12px; position: relative; line-height: 1.6; cursor: pointer; }
  .dialogue-left { background: var(--card2); border: 1px solid var(--border); border-bottom-left-radius: 4px; align-self: flex-start; }
  .dialogue-right { background: rgba(232,168,56,0.12); border: 1px solid rgba(232,168,56,0.2); border-bottom-right-radius: 4px; align-self: flex-end; }
  .writing-char { width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; font-size: 26px; cursor: pointer; transition: all 0.3s; position: relative; }
  .writing-char:hover { border-color: var(--accent); background: rgba(232,168,56,0.08); transform: translateY(-3px); }
  .writing-char .char-label { position: absolute; bottom: -20px; font-size: 10px; color: var(--muted); white-space: nowrap; }

  .quiz-option { padding: 12px 18px; background: var(--card2); border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.25s; font-size: 14px; text-align: left; width: 100%; color: var(--fg); }
  .quiz-option:hover { border-color: var(--accent); background: rgba(232,168,56,0.05); }
  .quiz-option.correct { border-color: var(--success); background: rgba(78,168,122,0.12); }
  .quiz-option.wrong { border-color: var(--danger); background: rgba(212,74,74,0.12); }
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-arrow { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--fg2); cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.25s; }
  .nav-arrow:hover { border-color: var(--accent); color: var(--accent); }
  .nav-arrow:disabled { opacity: 0.3; cursor: default; }

  .toast { position: fixed; bottom: 30px; right: 30px; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: 500; z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.4s cubic-bezier(0.4,0,0.2,1); border: 1px solid; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: rgba(78,168,122,0.15); border-color: rgba(78,168,122,0.3); color: var(--success); }
  .toast.error { background: rgba(212,74,74,0.15); border-color: rgba(212,74,74,0.3); color: var(--danger); }
  .toast.info { background: rgba(232,168,56,0.15); border-color: rgba(232,168,56,0.3); color: var(--accent); }

  .stats-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 20px; position: sticky; top: 0; z-index: 30; backdrop-filter: blur(12px); }
  .stat-item { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2); }
  .stat-val { font-weight: 700; color: var(--fg); }

  .char-detail-panel { position: fixed; top:0; right:-450px; width:440px; height:100vh; background: var(--bg2); border-left: 1px solid var(--border); z-index: 100; padding: 32px; transition: right 0.4s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; }
  .char-detail-panel.open { right: 0; }
  .char-detail-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .char-detail-overlay.open { opacity: 1; pointer-events: all; }

  .ai-chat-area { display: flex; flex-direction: column; gap: 16px; max-height: 450px; overflow-y: auto; padding: 12px; margin-bottom: 16px; background: rgba(0,0,0,0.2); border-radius: 12px; }
  .ai-msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; font-size: 14px; word-wrap: break-word; }
  .ai-msg-user { align-self: flex-end; background: rgba(232,168,56,0.1); border: 1px solid rgba(232,168,56,0.2); }
  .ai-msg-assistant { align-self: flex-start; background: var(--ai-bg); border: 1px solid var(--ai-border); }
  .ai-msg-assistant strong { color: var(--ai); }
  .ai-input-area { display: flex; gap: 10px; }
  .ai-input { flex: 1; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--fg); outline: none; font-size: 14px; }
  .ai-send { width: 40px; height: 40px; border-radius: 10px; background: var(--ai); color: var(--bg); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }

  .ai-inline { margin-top: 12px; padding: 16px; border-radius: 10px; background: var(--ai-bg); border: 1px solid var(--ai-border); font-size: 13px; color: var(--fg2); line-height: 1.6; }
  .ai-inline h4 { color: var(--ai); font-size: 14px; margin-bottom: 8px; }
  .ai-ask-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; background: var(--ai-bg); border: 1px solid var(--ai-border); color: var(--ai); font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }

  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .rank-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .ai-topic-card { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.25s; text-align: center; }
  .ai-topic-card:hover { border-color: var(--ai); background: var(--ai-bg); transform: translateY(-3px); }
  .setting-input { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card2); color: var(--fg); font-size: 14px; outline: none; }

  /* Flashcards */
  .flashcard-container { perspective: 1000px; width: 100%; max-width: 400px; height: 260px; margin: 0 auto; cursor: pointer; }
  .flashcard { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
  .flashcard.flipped { transform: rotateY(180deg); }
  .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; border: 2px solid var(--border); background: var(--card); padding: 30px; }
  .flashcard-back { transform: rotateY(180deg); border-color: var(--accent); background: var(--card2); }

  /* Memory Match */
  .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .memory-card { height: 100px; background: var(--card2); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; padding: 10px; transition: all 0.3s; }
  .memory-card.flipped { border-color: var(--game); background: var(--game-bg); color: var(--game); }
  .memory-card.matched { border-color: var(--success); background: rgba(78,168,122,0.1); color: var(--success); opacity: 0.5; cursor: default; }
  .memory-card.wrong { border-color: var(--danger); background: rgba(212,74,74,0.1); }

  /* Speed Round */
  .timer-ring { width: 60px; height: 60px; border-radius: 50%; border: 4px solid var(--border); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-glow"></div><div class="bg-glow2"></div>
<div id="app"></div><div id="toast-container"></div>
<div class="char-detail-overlay" id="charOverlay" onclick="closeCharPanel()"></div>
<div class="char-detail-panel" id="charPanel"></div>

<script>
// ========== RANKS ==========
const RANKS = [
  { name: 'Novice', icon: 'fa-seedling', minXP: 0, color: '#7a7468', bg: 'rgba(122,116,104,0.12)' },
  { name: 'Beginner', icon: 'fa-leaf', minXP: 100, color: '#4ea87a', bg: 'rgba(78,168,122,0.12)' },
  { name: 'Learner', icon: 'fa-book-open', minXP: 300, color: '#4ea8d6', bg: 'rgba(78,168,214,0.12)' },
  { name: 'Scholar', icon: 'fa-graduation-cap', minXP: 700, color: '#e8a838', bg: 'rgba(232,168,56,0.12)' },
  { name: 'Linguist', icon: 'fa-language', minXP: 1200, color: '#d4763a', bg: 'rgba(212,118,58,0.12)' },
  { name: 'Expert', icon: 'fa-star', minXP: 2000, color: '#ffd700', bg: 'rgba(255,215,0,0.12)' },
  { name: 'Master', icon: 'fa-crown', minXP: 3500, color: '#ffd700', bg: 'rgba(255,215,0,0.18)' },
  { name: 'Sage', icon: 'fa-gem', minXP: 5500, color: '#b9f2ff', bg: 'rgba(185,242,255,0.12)' },
  { name: 'Polyglot', icon: 'fa-fire', minXP: 8500, color: '#e040fb', bg: 'rgba(224,64,251,0.12)' }
];
function getRank(xp) { let rank = RANKS[0]; for (const r of RANKS) { if (xp >= r.minXP) rank = r; } return rank; }

// ========== STATE & PERSISTENCE ==========
const state = {
  view: 'select', lang: null, module: 'tutorial', tutorialStep: 0,
  quizIndex: 0, quizScore: 0, quizAnswered: false, _quizQuestions: null,
  mobileMenuOpen: false, aiChat: [], aiLoading: false, aiConvTopic: null,
  aiConvMessages: [], aiInline: {}, aiInlineLoading: {}, providers: [],
  defaultProvider: null,
  flashcardIndex: 0, flashcardFlipped: false,
  memoryCards: [], memoryFlipped: [], memoryMatches: 0, memoryLocked: false,
  speedRoundActive: false, speedRoundTime: 0, speedRoundScore: 0, speedRoundQ: null
};
const save = JSON.parse(localStorage.getItem('polyglot_save')) || { xp: 0, streak: 0, lastDay: null, aiUrl: window.location.origin.replace('8501', '8000'), aiModel: 'llama3.2', aiProvider: 'ollama', studentId: 'user_' + Math.floor(Math.random()*10000) };
function saveState() { localStorage.setItem('polyglot_save', JSON.stringify(save)); }
function addXP(amount) { save.xp += amount; saveState(); showToast(`+${amount} XP gained!`, 'success'); render(); }
function checkStreak() {
  const today = new Date().toDateString(); if (save.lastDay === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  save.streak = save.lastDay === yesterday ? save.streak + 1 : 1; save.lastDay = today; saveState();
}

// ========== AI ENGINE ==========
const ai = {
  apiBase: window.location.origin.replace('8501', '8000'),
  connected: false,
  async testConnection() {
    try {
      const r = await fetch(`${this.apiBase}/api/lesson/providers`);
      if (r.ok) {
        const d = await r.json(); state.providers = d.providers; state.defaultProvider = d.defaultProvider;
        this.connected = true; return true;
      }
    } catch (e) {}
    this.connected = false; return false;
  },
  buildSystemPrompt(lang) {
    return `You are an expert ${lang.name} teacher. Help the user learn. Be concise, accurate and practical. Use markdown formatting. Provide example sentences with translations.`;
  },
  async chat(messages, lang) {
    try {
      const fullMessages = [{role: 'system', content: this.buildSystemPrompt(lang)}, ...messages];
      const body = { messages: fullMessages, provider: save.aiProvider, model: save.aiModel };
      const r = await fetch(`${this.apiBase}/api/chat`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.ok) { const d = await r.json(); return d.message.content; }
    } catch (e) { showToast('AI connection failed', 'error'); }
    return null;
  }
};

// ========== UTILS ==========
function mdToHtml(t) {
  if (!t) return '';
  return t
    .replace(/### (.*)/g, '<h4>$1</h4>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n/g, '<br>');
}

// ========== SPEECH ENGINE ==========
let mediaRecorder; let audioChunks = [];
async function startRecording() {
  if (!navigator.mediaDevices) { showToast('Microphone not supported', 'error'); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream); audioChunks = []; mediaRecorder.ondataavailable = e => audioChunks.push(e.data); mediaRecorder.start();
}
async function stopRecording(expectedText) {
  return new Promise(resolve => {
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/wav' }); const formData = new FormData();
      formData.append('file', audioBlob, 'speech.wav'); formData.append('student_id', save.studentId);
      if (expectedText) formData.append('expected_text', expectedText);
      try {
        const r = await fetch(`${ai.apiBase}/api/speech/analyze`, { method: 'POST', body: formData });
        if (r.ok) { const d = await r.json(); resolve(d); }
      } catch (e) { showToast('Speech analysis failed', 'error'); }
      resolve(null);
    };
    mediaRecorder.stop();
  });
}

// ========== LANGUAGE DATA ==========
const LANGUAGES = {
  japanese: {
    name: 'Japanese', native: '日本語', flag: '🇯🇵', code: 'ja-JP', family: 'Japonic', script: 'Kana + Kanji', color: '#e84848',
    description: 'A fascinating language with three writing systems and deep cultural nuance.',
    tutorial: [
      { title: 'Welcome to Japanese', body: 'Japanese (日本語) is spoken by 125 million people. It uses three writing systems: Hiragana for native words, Katakana for foreign words, and Kanji (Chinese characters) for conceptual meaning. The language follows SOV (Subject-Object-Verb) word order.' },
      { title: 'Pronunciation Basics', body: 'Japanese has 5 vowel sounds: a (あ), i (い), u (う), e (え), o (お). Consonants are relatively simple — there are no complex clusters. Each syllable is pronounced with equal length and stress, unlike English which has stressed and unstressed syllables.' },
      { title: 'Essential Particles', body: 'Particles are the glue of Japanese grammar. は (wa) marks the topic, が (ga) marks the subject, を (wo) marks the object, に (ni) indicates direction/time, で (de) indicates location of action. Mastering particles is key to fluency.' },
      { title: 'Politeness Levels', body: 'Japanese has multiple politeness levels. です/ます (desu/masu) form is polite and safe for most situations. Casual form drops these. There are also humble (kenjougo) and respectful (sonkeigo) forms used in business and formal contexts.' },
      { title: 'Writing Systems', body: 'Start with Hiragana — 46 basic characters. Then learn Katakana for loanwords. Kanji (2,136 common use characters) can be learned gradually. Every Kanji has onyomi (Chinese reading) and kunyomi (Japanese reading).' }
    ],
    vocabulary: [
      { word: 'こんにちは', reading: 'Konnichiwa', meaning: 'Hello', type: 'Greeting', usage: 'Used during daytime (morning to evening). Not used with close family at home.', example: 'こんにちは、元気ですか？', exampleMeaning: 'Hello, how are you?' },
      { word: 'ありがとう', reading: 'Arigatou', meaning: 'Thank you', type: 'Expression', usage: 'Casual thanks. Add ございます (gozaimasu) for formal situations.', example: 'プレゼントをありがとう。', exampleMeaning: 'Thank you for the present.' },
      { word: '食べる', reading: 'Taberu', meaning: 'To eat', type: 'Verb (ichidan)', usage: 'An ichidan (ru) verb. Conjugates: 食べない (don\'t eat), 食べた (ate), 食べよう (let\'s eat).', example: '毎日野菜を食べます。', exampleMeaning: 'I eat vegetables every day.' },
      { word: '水', reading: 'Mizu', meaning: 'Water', type: 'Noun', usage: 'Basic noun. Can combine: 水泳 (suiei = swimming), 水曜日 (suiyoubi = Wednesday).', example: '水を飲みます。', exampleMeaning: 'I drink water.' },
      { word: '大きい', reading: 'Ookii', meaning: 'Big', type: 'Adjective (i)', usage: 'An i-adjective. Conjugates: 大きくない (not big), 大きかった (was big), 大きくなる (to become big).', example: 'この部屋は大きいです。', exampleMeaning: 'This room is big.' },
      { word: '行く', reading: 'Iku', meaning: 'To go', type: 'Verb (godan)', usage: 'A godan (u) verb. Irregular te-form: 行って (itte). Common pattern: 〜へ行く (go to ~).', example: '学校に行きます。', exampleMeaning: 'I go to school.' },
      { word: '美しい', reading: 'Utsukushii', meaning: 'Beautiful', type: 'Adjective (i)', usage: 'Used for visual beauty, scenery, art. For people\'s character, use 素晴らしい (subarashii).', example: '桜は美しい花です。', exampleMeaning: 'Cherry blossoms are beautiful flowers.' },
      { word: '友達', reading: 'Tomodachi', meaning: 'Friend', type: 'Noun', usage: 'Casual term. In formal speech, use 友人. Note: 達 is a plural suffix but tomodachi can mean singular or plural.', example: '友達と遊びます。', exampleMeaning: 'I play with friends.' },
      { word: '先生', reading: 'Sensei', meaning: 'Teacher / Doctor', type: 'Noun', usage: 'Honorific title used for teachers, doctors, lawyers, politicians. Never use for yourself.', example: '先生、質問があります。', exampleMeaning: 'Teacher, I have a question.' },
      { word: '勉強する', reading: 'Benkyou suru', meaning: 'To study', type: 'Verb (suru)', usage: 'A suru (noun+する) verb. 勉強 alone means "study" as a noun. Conjugate する part: 勉強した (studied).', example: '日本語を勉強しています。', exampleMeaning: 'I am studying Japanese.' }
    ],
    grammar: [
      { rule: 'SOV Word Order', explanation: 'Japanese always places the verb at the end: Subject + Object + Verb. The subject is often omitted when understood from context.', example: '私は リンゴを 食べます。', breakdown: [{part:'私は', role:'Topic (I)', color:'#e84848'},{part:'リンゴを', role:'Object (apple)', color:'#4ea87a'},{part:'食べます', role:'Verb (eat)', color:'#e8a838'}] },

// ========== ACTIONS ==========
function selectLanguage(k) {
  state.lang = k; state.view = 'learn'; state.module = 'tutorial'; state.tutorialStep = 0;
  state._quizQuestions = null; state.aiChat = []; state.aiConvTopic = null;
  state.flashcardIndex = 0; state.memoryCards = []; state.speedRoundActive = false;
  checkStreak(); render();
}
function goBack() { state.view = 'select'; state.lang = null; render(); }
function setModule(m) {
  state.module = m;
  if (m === 'practice') state._quizQuestions = null;
  if (m === 'memory') state.memoryCards = [];
  if (m === 'speed') state.speedRoundActive = false;
  render(); document.getElementById('mainContent').scrollTop = 0;
}
function navTutorial(d) { state.tutorialStep += d; if (d > 0) addXP(20); render(); }

function navFlashcards(d) {
  state.flashcardIndex += d; state.flashcardFlipped = false; addXP(5); render();
}

function initMemory(l) {
  const v = l.vocabulary.slice(0, 8);
  const cards = [];
  v.forEach(item => {
    cards.push({ val: item.word, matchId: item.word, flipped: false, matched: false });
    cards.push({ val: item.meaning, matchId: item.word, flipped: false, matched: false });
  });
  state.memoryCards = cards.sort(() => Math.random() - 0.5);
  state.memoryFlipped = []; state.memoryMatches = 0; state.memoryLocked = false;
  render();
}

function flipMemory(i) {
  if (state.memoryLocked || state.memoryCards[i].flipped || state.memoryCards[i].matched) return;
  state.memoryCards[i].flipped = true;
  state.memoryFlipped.push(i);
  render();
  if (state.memoryFlipped.length === 2) {
    state.memoryLocked = true;
    const [a, b] = state.memoryFlipped;
    if (state.memoryCards[a].matchId === state.memoryCards[b].matchId) {
      state.memoryCards[a].matched = true;
      state.memoryCards[b].matched = true;
      state.memoryMatches++;
      addXP(30);
      state.memoryFlipped = [];
      state.memoryLocked = false;
      if (state.memoryMatches === 8) showToast('Perfect Match!', 'success');
      render();
    } else {
      setTimeout(() => {
        state.memoryCards[a].flipped = false;
        state.memoryCards[b].flipped = false;
        state.memoryFlipped = [];
        state.memoryLocked = false;
        render();
      }, 1000);
    }
  }
}

function startSpeedRound() {
  state.speedRoundActive = true;
  state.speedRoundScore = 0;
  state.speedRoundTime = 60;
  genSpeedQ();
  const timer = setInterval(() => {
    state.speedRoundTime--;
    if (state.speedRoundTime <= 0) {
      clearInterval(timer);
      state.speedRoundActive = false;
      showToast(`Finished! Score: ${state.speedRoundScore}`, 'success');
      addXP(state.speedRoundScore * 10);
      render();
    } else {
      render();
    }
  }, 1000);
}

function genSpeedQ() {
  const v = LANGUAGES[state.lang].vocabulary;
  const vi = v[Math.floor(Math.random() * v.length)];
  const o = v.filter(x => x.word !== vi.word).sort(() => Math.random() - 0.5).slice(0, 3).map(x => x.meaning);
  const opts = [...o, vi.meaning].sort(() => Math.random() - 0.5);
  state.speedRoundQ = { word: vi.word, options: opts, correct: opts.indexOf(vi.meaning) };
}

function answerSpeedRound(i) {
  if (i === state.speedRoundQ.correct) {
    state.speedRoundScore++;
    showToast('+1', 'success');
  } else {
    showToast('Wrong!', 'error');
  }
  genSpeedQ();
  render();
}
function toggleVocab(i) { document.getElementById(`v-det-${i}`).classList.toggle('hidden'); }
async function askAIAboutWord(i) {
  const v = LANGUAGES[state.lang].vocabulary[i]; const t = document.getElementById(`ai-word-${i}`); t.innerHTML = '<div class="ai-inline">Analyzing...</div>';
  const r = await ai.chat([{role:'user', content:`Explain nuance: "${v.word}" in ${LANGUAGES[state.lang].name}. 3 examples.`}], LANGUAGES[state.lang]);
  t.innerHTML = `<div class="ai-inline"><h4>AI Insight</h4>${mdToHtml(r)}</div>`; addXP(10);
}
async function askAIAboutGrammar(i) {
  const g = LANGUAGES[state.lang].grammar[i]; const t = document.getElementById(`ai-gram-${i}`); t.innerHTML = '<div class="ai-inline">Generating...</div>';
  const r = await ai.chat([{role:'user', content:`Explain rule: "${g.rule}". ${g.explanation}`}], LANGUAGES[state.lang]);
  t.innerHTML = `<div class="ai-inline"><h4>AI Deep Dive</h4>${mdToHtml(r)}</div>`; addXP(10);
}
async function sendChat() {
  const i = document.getElementById('aiInput'); const t = i.value.trim(); if (!t || state.aiLoading) return;
  state.aiChat.push({ role: 'user', content: t }); i.value = ''; state.aiLoading = true; render();
  const r = await ai.chat(state.aiChat.slice(-10), LANGUAGES[state.lang]); if (r) state.aiChat.push({ role: 'assistant', content: r });
  state.aiLoading = false; addXP(5); render();
  const a = document.getElementById('aiChatArea'); if(a) a.scrollTop = a.scrollHeight;
}
async function startAIConv(topic) {
  state.aiConvTopic = topic; state.aiLoading = true; render();
  const r = await ai.chat([{role:'user', content:`Roleplay conversation about "${topic}" in ${LANGUAGES[state.lang].name}. You start.`}], LANGUAGES[state.lang]);
  state.aiConvMessages = [{role: 'assistant', content: r || "Let's start!"}]; state.aiLoading = false; render();
}
async function sendAIConv() {
  const i = document.getElementById('aiConvInput'); const t = i.value.trim(); if (!t || state.aiLoading) return;
  state.aiConvMessages.push({ role: 'user', content: t }); i.value = ''; state.aiLoading = true; render();
  const r = await ai.chat(state.aiConvMessages.slice(-10), LANGUAGES[state.lang]); if (r) state.aiConvMessages.push({ role: 'assistant', content: r });
  state.aiLoading = false; addXP(15); render();
  const a = document.getElementById('aiChatArea'); if(a) a.scrollTop = a.scrollHeight;
}
async function analyzePronunciation(word, index) {
  const b = document.getElementById(`rec-btn-${index}`);
  if (b.classList.contains('recording')) {
    b.classList.remove('recording'); showToast('Analyzing...', 'info');
    const res = await stopRecording(word);
    if (res) { showToast(`Score: ${res.fluency_score}% - Stress: ${res.stress_level}`, res.fluency_score > 70 ? 'success' : 'info'); addXP(Math.round(res.fluency_score / 2)); }
  } else { b.classList.add('recording'); await startRecording(); }
}
function generateQuiz(l) {
  const v = l.vocabulary; if (!v || v.length < 2) return [];
  return v.map(vi => {
    const o = v.filter(x => x.word !== vi.word).sort(() => Math.random() - 0.5).slice(0, 3);
    const opts = [...o.map(x => x.meaning), vi.meaning].sort(() => Math.random() - 0.5);
    return { type: 'Translation', question: `Meaning of "${vi.word}"?`, options: opts, correct: opts.indexOf(vi.meaning), selected: -1 };
  }).sort(() => Math.random() - 0.5).slice(0, 10);
}
function answerQuiz(i) { state.quizAnswered = true; const q = state._quizQuestions[state.quizIndex]; q.selected = i; if (i === q.correct) { state.quizScore++; showToast('Correct!', 'success'); } else showToast('Incorrect', 'error'); render(); }
function nextQuestion() { state.quizIndex++; state.quizAnswered = false; if (state.quizIndex >= state._quizQuestions.length) addXP(50); render(); }
function resetQuiz() { state._quizQuestions = null; render(); }
function saveSettings() { save.studentId = document.getElementById('studentIdInput').value; save.aiUrl = document.getElementById('aiUrlInput').value; save.aiProvider = document.getElementById('aiProviderSelect').value; save.aiModel = document.getElementById('aiModelSelect').value; saveState(); ai.apiBase = save.aiUrl; showToast('Saved', 'success'); }
function updateModels() { render(); }
function getCurrentProviderModels() { const pId = document.getElementById('aiProviderSelect')?.value || save.aiProvider; const p = state.providers.find(x => x.id === pId); return p ? p.models : [save.aiModel]; }
function openCharPanel(i) {
  const c = LANGUAGES[state.lang].writing.chars[i]; const p = document.getElementById('charPanel'); const o = document.getElementById('charOverlay');
  p.innerHTML = `<button onclick="closeCharPanel()" class="absolute top-6 right-6 text-muted"><i class="fas fa-times"></i></button><div class="flex flex-col items-center justify-center h-full"><div class="text-[120px] mb-6 font-serif leading-none">${c.char}</div><div class="text-3xl text-accent font-bold mb-4">${c.reading}</div><div class="text-fg2 text-center max-w-xs leading-relaxed mb-10">${c.note}</div><button class="speak-btn w-16 h-16 text-xl" onclick="speak('${c.char}', '${LANGUAGES[state.lang].code}')"><i class="fas fa-volume-up"></i></button></div>`;
  p.classList.add('open'); o.classList.add('open');
}
function closeCharPanel() { document.getElementById('charPanel').classList.remove('open'); document.getElementById('charOverlay').classList.remove('open'); }
function speak(text, code) { if (!('speechSynthesis' in window)) return; const u = new SpeechSynthesisUtterance(text); u.lang = code; speechSynthesis.speak(u); }
function showToast(msg, type) {
  const c = document.getElementById('toast-container'); const t = document.createElement('div'); t.className = `toast show ${type}`; t.innerText = msg; c.appendChild(t);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500);
}
// ========== INIT ==========
ai.testConnection().then(() => render());
render();
</script>
