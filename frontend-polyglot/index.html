<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polyglot — AI-Powered Language Learning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b09;--bg2:#141310;--card:#1c1b17;--card2:#242320;--fg:#f2ece0;--fg2:#c8c0b2;--muted:#7a7468;--accent:#e8a838;--accent2:#d4763a;--accent3:#4ea87a;--border:#2e2d28;--danger:#d44a4a;--success:#4ea87a;--ai:#c084fc;--ai-bg:rgba(192,132,252,.08);--ai-border:rgba(192,132,252,.2)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4,h5{font-family:'Playfair Display',serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.bg-glow{position:fixed;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(232,168,56,.05) 0%,transparent 70%);pointer-events:none;z-index:0}
.bg-glow2{position:fixed;bottom:-300px;left:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(192,132,252,.03) 0%,transparent 70%);pointer-events:none;z-index:0}
.lang-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;cursor:pointer;transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.lang-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.lang-card:hover::before{transform:scaleX(1)}.lang-card:hover{border-color:var(--accent);transform:translateY(-6px);box-shadow:0 20px 40px rgba(0,0,0,.4),0 0 60px rgba(232,168,56,.06)}
.module-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;cursor:pointer;transition:all .25s;color:var(--fg2);font-size:13px;font-weight:500;border:1px solid transparent;width:100%;text-align:left;background:none;font-family:inherit}
.module-btn:hover{background:var(--card2);color:var(--fg)}.module-btn.active{background:rgba(232,168,56,.1);color:var(--accent);border-color:rgba(232,168,56,.2)}
.module-btn.ai-mod.active{background:var(--ai-bg);color:var(--ai);border-color:var(--ai-border)}
.module-btn i{width:18px;text-align:center;font-size:14px}
.module-btn .mod-badge{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700}
.content-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:16px;transition:border-color .3s}
.content-card:hover{border-color:rgba(232,168,56,.2)}
.vocab-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;transition:all .3s;cursor:pointer}
.vocab-card:hover{border-color:var(--accent);background:rgba(232,168,56,.04);transform:translateX(4px)}
.speak-btn{width:38px;height:38px;border-radius:50%;background:rgba(232,168,56,.13);border:1px solid rgba(232,168,56,.25);color:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.speak-btn:hover{background:var(--accent);color:var(--bg);transform:scale(1.1)}
.speak-btn.speaking{animation:pulse-s .8s ease-in-out infinite}
@keyframes pulse-s{0%,100%{box-shadow:0 0 0 0 rgba(232,168,56,.4)}50%{box-shadow:0 0 0 12px rgba(232,168,56,0)}}
.grammar-rule{background:var(--card2);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:20px 24px;margin-bottom:14px}
.phrase-part{display:inline-flex;align-items:center;padding:6px 14px;border-radius:8px;margin:3px;font-size:15px}
.dialogue-bubble{max-width:80%;padding:14px 18px;border-radius:16px;margin-bottom:12px;line-height:1.6;cursor:pointer}
.dialogue-left{background:var(--card2);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.dialogue-right{background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.18);border-bottom-right-radius:4px;align-self:flex-end}
.writing-char{width:68px;height:68px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;font-size:26px;cursor:pointer;transition:all .3s;position:relative}
.writing-char:hover{border-color:var(--accent);background:rgba(232,168,56,.06);transform:translateY(-3px)}
.writing-char .char-label{position:absolute;bottom:-18px;font-size:9px;color:var(--muted);white-space:nowrap}
.quiz-option{padding:13px 18px;background:var(--card2);border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .25s;font-size:14px;text-align:left;width:100%;color:var(--fg);font-family:inherit}
.quiz-option:hover:not(:disabled){border-color:var(--accent);background:rgba(232,168,56,.04)}
.quiz-option.correct{border-color:var(--success);background:rgba(78,168,122,.12)}
.quiz-option.wrong{border-color:var(--danger);background:rgba(212,74,74,.12)}
.quiz-option:disabled{cursor:default;opacity:.7}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.nav-arrow{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--fg2);cursor:pointer;font-size:13px;font-weight:500;transition:all .25s;font-family:inherit}
.nav-arrow:hover{border-color:var(--accent);color:var(--accent)}.nav-arrow:disabled{opacity:.3;cursor:default}
.toast{position:fixed;bottom:30px;right:30px;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:500;z-index:9999;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.4,0,.2,1);border:1px solid;max-width:360px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:rgba(78,168,122,.15);border-color:rgba(78,168,122,.3);color:var(--success)}
.toast.error{background:rgba(212,74,74,.15);border-color:rgba(212,74,74,.3);color:var(--danger)}
.toast.info{background:rgba(232,168,56,.15);border-color:rgba(232,168,56,.3);color:var(--accent)}
.xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:32px;font-weight:900;color:var(--accent);z-index:9998;pointer-events:none;text-shadow:0 0 30px rgba(232,168,56,.5);transition:all .6s cubic-bezier(.4,0,.2,1)}
.xp-popup.show{transform:translate(-50%,-80%) scale(1);opacity:0}
.fade-in{animation:fadeIn .4s ease-out}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.example-box{background:rgba(232,168,56,.05);border:1px solid rgba(232,168,56,.12);border-radius:10px;padding:14px 18px;margin-top:10px}
.stats-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:30;backdrop-filter:blur(12px)}
.stat-item{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--fg2)}
.stat-item i{font-size:14px}.stat-item .stat-val{font-weight:700;color:var(--fg)}
.xp-bar-mini{width:120px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.xp-bar-mini-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s}
.streak-dot{width:14px;height:14px;border-radius:3px;background:var(--card2);border:1px solid var(--border);transition:all .2s}
.streak-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 6px rgba(232,168,56,.3)}
.streak-dot.today{border-color:var(--accent);border-width:2px}
.flashcard-container{perspective:1000px;width:100%;max-width:480px;height:300px;margin:0 auto;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flashcard-inner.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;top:0;left:0;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;border:1px solid var(--border)}
.flashcard-front{background:linear-gradient(145deg,var(--card),var(--card2))}
.flashcard-back{background:linear-gradient(145deg,var(--card2),var(--card));transform:rotateY(180deg)}
.memory-card{width:100%;aspect-ratio:1;border-radius:10px;background:var(--card2);border:1px solid var(--border);cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:6px;text-align:center;position:relative;overflow:hidden}
.memory-card.revealed{border-color:var(--accent);background:rgba(232,168,56,.08)}
.memory-card.matched{border-color:var(--success);background:rgba(78,168,122,.12);cursor:default}
.memory-card .memory-content{opacity:0;transition:opacity .3s}.memory-card.revealed .memory-content,.memory-card.matched .memory-content{opacity:1}
.memory-card .memory-hidden{transition:opacity .3s}.memory-card.revealed .memory-hidden,.memory-card.matched .memory-hidden{opacity:0}
.speed-timer{width:100%;height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:20px}
.speed-timer-fill{height:100%;background:linear-gradient(90deg,var(--danger),var(--accent),var(--success));border-radius:4px;transition:width .1s linear}
.dict-input{width:100%;padding:14px 18px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--fg);font-size:16px;font-family:inherit;transition:border-color .3s;outline:none}
.dict-input:focus{border-color:var(--accent)}.dict-input::placeholder{color:var(--muted)}
.rank-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
.char-detail-panel{position:fixed;top:0;right:-450px;width:440px;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:100;padding:32px;transition:right .4s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.char-detail-panel.open{right:0}
.char-detail-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99;opacity:0;pointer-events:none;transition:opacity .3s}
.char-detail-overlay.open{opacity:1;pointer-events:all}

/* AI Styles */
.ai-chat-area{display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 320px);overflow-y:auto;padding:4px 2px;min-height:300px}
.ai-msg{max-width:88%;padding:16px 20px;border-radius:16px;line-height:1.7;font-size:14px;word-wrap:break-word}
.ai-msg-user{background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.18);border-bottom-right-radius:4px;align-self:flex-end}
.ai-msg-assistant{background:var(--ai-bg);border:1px solid var(--ai-border);border-bottom-left-radius:4px;align-self:flex-start}
.ai-msg-assistant strong{color:var(--ai);font-weight:600}
.ai-msg-assistant code{background:rgba(192,132,252,.12);padding:1px 6px;border-radius:4px;font-size:13px;color:var(--ai)}
.ai-msg-assistant ul,.ai-msg-assistant ol{margin:8px 0 8px 20px;color:var(--fg2)}
.ai-msg-assistant li{margin-bottom:4px}
.ai-msg-assistant h4{color:var(--ai);font-size:15px;margin:12px 0 6px;font-weight:700}
.ai-msg-assistant p{margin-bottom:6px}
.ai-input-area{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.ai-input{flex:1;padding:12px 16px;border-radius:12px;border:2px solid var(--border);background:var(--card2);color:var(--fg);font-size:14px;font-family:inherit;outline:none;transition:border-color .3s}
.ai-input:focus{border-color:var(--ai)}
.ai-send{width:44px;height:44px;border-radius:12px;background:var(--ai);border:none;color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s;flex-shrink:0}
.ai-send:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(192,132,252,.3)}
.ai-send:disabled{opacity:.4;cursor:default;transform:none}
.ai-typing{display:flex;gap:4px;padding:16px 20px;align-self:flex-start}
.ai-typing span{width:8px;height:8px;border-radius:50%;background:var(--ai);animation:aiType 1.4s infinite}
.ai-typing span:nth-child(2){animation-delay:.2s}.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes aiType{0%,60%,100%{opacity:.2;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
.ai-inline{background:var(--ai-bg);border:1px solid var(--ai-border);border-radius:12px;padding:16px 20px;margin-top:12px;animation:fadeIn .4s ease-out}
.ai-inline h4{color:var(--ai);font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.ai-inline strong{color:var(--ai)}
.ai-inline code{background:rgba(192,132,252,.12);padding:1px 6px;border-radius:4px;font-size:13px;color:var(--ai)}
.ai-inline ul,.ai-inline ol{margin:6px 0 6px 18px;color:var(--fg2)}.ai-inline li{margin-bottom:3px;font-size:13px}
.ai-inline p{font-size:13px;color:var(--fg2);line-height:1.7;margin-bottom:4px}
.ai-ask-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;border:1px solid var(--ai-border);background:var(--ai-bg);color:var(--ai);cursor:pointer;font-size:11px;font-weight:600;transition:all .2s;font-family:inherit}
.ai-ask-btn:hover{background:rgba(192,132,252,.15);border-color:var(--ai)}
.ai-ask-btn:disabled{opacity:.4;cursor:default}
.ai-status{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.ai-status.connected{background:rgba(78,168,122,.12);color:var(--success);border:1px solid rgba(78,168,122,.25)}
.ai-status.disconnected{background:rgba(212,74,74,.1);color:var(--danger);border:1px solid rgba(212,74,74,.2)}
.ai-status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.ai-topic-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:all .25s;text-align:center}
.ai-topic-card:hover{border-color:var(--ai);background:var(--ai-bg);transform:translateY(-3px)}
.setting-input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--fg);font-size:14px;font-family:inherit;outline:none;transition:border-color .3s}
.setting-input:focus{border-color:var(--ai)}

@media(max-width:768px){
  .sidebar{display:none!important}.sidebar.mobile-open{display:flex!important;position:fixed;top:0;left:0;width:260px;height:100vh;z-index:50;background:var(--bg2);border-right:1px solid var(--border)}
  .mobile-toggle{display:flex!important}.char-detail-panel{width:100%;right:-100%}
  .stats-bar{padding:8px 14px;gap:10px;font-size:11px}.xp-bar-mini{width:70px}
  .flashcard-container{height:240px}.ai-chat-area{max-height:calc(100vh - 360px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg-glow"></div><div class="bg-glow2"></div>
<div id="app"></div>
<div id="toast-container"></div>
<div class="xp-popup" id="xpPopup"></div>
<div class="char-detail-overlay" id="charOverlay" onclick="closeCharPanel()"></div>
<div class="char-detail-panel" id="charPanel"></div>
<script>
/* ========== RANKS & XP ========== */
const RANKS=[
  {name:'Novice',icon:'fa-seedling',minXP:0,color:'#7a7468',bg:'rgba(122,116,104,.12)'},
  {name:'Beginner',icon:'fa-leaf',minXP:100,color:'#4ea87a',bg:'rgba(78,168,122,.12)'},
  {name:'Learner',icon:'fa-book-open',minXP:300,color:'#4ea8d6',bg:'rgba(78,168,214,.12)'},
  {name:'Student',icon:'fa-pen',minXP:700,color:'#a88858',bg:'rgba(168,136,88,.12)'},
  {name:'Scholar',icon:'fa-graduation-cap',minXP:1200,color:'var(--accent)',bg:'rgba(232,168,56,.12)'},
  {name:'Linguist',icon:'fa-language',minXP:2000,color:'var(--accent2)',bg:'rgba(212,118,58,.12)'},
  {name:'Expert',icon:'fa-star',minXP:3200,color:'#ffd700',bg:'rgba(255,215,0,.12)'},
  {name:'Master',icon:'fa-crown',minXP:5000,color:'#ffd700',bg:'rgba(255,215,0,.15)'},
  {name:'Sage',icon:'fa-gem',minXP:7500,color:'#b9f2ff',bg:'rgba(185,242,255,.12)'},
  {name:'Polyglot',icon:'fa-fire',minXP:11000,color:'#e040fb',bg:'rgba(224,64,251,.12)'}
];
function getRank(xp){let r=RANKS[0];for(const rk of RANKS)if(xp>=rk.minXP)r=rk;return r;}
function getNextRank(xp){for(const rk of RANKS)if(xp<rk.minXP)return rk;return null;}
function getXPProgress(xp){const c=getRank(xp),n=getNextRank(xp);if(!n)return 1;return(xp-c.minXP)/(n.minXP-c.minXP);}

/* ========== UI HELPERS ========== */
function showToast(msg, type='info'){
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle'}" style="margin-right:8px;"></i> ${msg}`;
  container.appendChild(toast);
  setTimeout(()=>toast.classList.add('show'), 100);
  setTimeout(()=>{
    toast.classList.remove('show');
    setTimeout(()=>container.removeChild(toast), 400);
  }, 4000);
}

function showXPPopup(a){
  const p = document.getElementById('xpPopup');
  p.textContent = `+${a} XP`;
  p.classList.remove('show');
  void p.offsetWidth;
  p.classList.add('show');
  setTimeout(()=>p.classList.remove('show'), 1000);
}

function speak(text, lang){
  if(!window.speechSynthesis) return null;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang;
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
  return u;
}

/* ========== PERSISTENCE ========== */
function loadSave(){
  try{
    let s = JSON.parse(localStorage.getItem('polyglot_save')) || {xp:0,streak:0,lastDay:null,streakDays:[],wordsKnown:{},achievements:[],aiUrl:'',aiModel:'llama3.2',studentId:''};
    if(!s.studentId) s.studentId = 'STU' + Math.random().toString(36).substring(2,9).toUpperCase();
    return s;
  }catch(e){
    return {xp:0,streak:0,lastDay:null,streakDays:[],wordsKnown:{},achievements:[],aiUrl:'',aiModel:'llama3.2',studentId:'STU'+Math.random().toString(36).substring(2,9).toUpperCase()};
  }
}
function saveSave(){localStorage.setItem('polyglot_save',JSON.stringify(save));}
function addXP(a){const o=getRank(save.xp);save.xp+=a;const n=getRank(save.xp);saveSave();showXPPopup(a);if(n.name!==o.name)setTimeout(()=>showToast('Rank Up: '+n.name+'!','info'),800);}
function checkStreak(){const t=new Date().toDateString();if(save.lastDay===t)return false;const y=new Date(Date.now()-864e5).toDateString();save.streak=save.lastDay===y?save.streak+1:1;save.lastDay=t;if(!save.streakDays)save.streakDays=[];if(!save.streakDays.includes(t))save.streakDays.push(t);save.streakDays=save.streakDays.filter(d=>Date.now()-new Date(d).getTime()<60*864e5);saveSave();return true;}
let save=loadSave();saveSave();
let state = {
  view: 'select',
  lang: 'japanese',
  module: 'tutorial',
  tutorialStep: 0,
  aiChat: [],
  aiLoading: false,
  mobileMenuOpen: false
};

/* ========== LINGUISTFLOW API ENGINE ========== */
const ai={
  url:'',
  model:'llama3.2',
  provider:'ollama',
  connected:false,
  checking:false,
  abortCtrl:null,

  async testConnection(){
    if(this.checking)return this.connected;
    this.checking=true;
    try{
      const r=await fetch('/healthz',{signal:AbortSignal.timeout(5000)});
      this.connected=r.ok;
      if(this.connected){
        const pr=await fetch('/api/lesson/providers');
        if(pr.ok){
          const d=await pr.json();
          this.provider=d.defaultProvider;
          const models=d.providers[this.provider]||[];
          this.model=models[0]||'llama3.2';
        }
      }
    }catch(e){this.connected=false;}
    this.checking=false;
    return this.connected;
  },

  buildSystemPrompt(lang){
    const isJapanese = lang.name === 'Japanese';
    const persona = isJapanese ? 'Nihongo Sensei (日本語の先生)' : `expert ${lang.name} teacher`;

    return `You are ${persona}. You have deep knowledge of ${lang.name} grammar, vocabulary, and culture.
Your goal is to help students learn in a supportive and natural way.

${isJapanese ? '- Use a mix of English and Japanese where appropriate.\n- Explain nuances of particles (wa, ga, ni, etc.) clearly.\n- Provide Hiragana/Katakana and Romanization for all Kanji used.' : ''}

Rules:
- Be accurate, concise, and practical.
- Provide example sentences with translations.
- Use markdown: **bold** for key terms, - for bullet lists, ### for subheadings, \`code\` for pronunciation.
- Adapt complexity to the student's level (simpler for beginners).
- If the user makes a mistake, gently correct them and explain why.
- Keep responses focused — don't ramble.`;
  },

  async chat(messages,lang,onChunk){
    this.abortCtrl=new AbortController();
    try{
      const sys={role:'system',content:this.buildSystemPrompt(lang)};
      const body={provider:this.provider,model:this.model,messages:[sys,...messages],stream:!!onChunk};
      const resp=await fetch('/api/llm/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:this.abortCtrl.signal});
      if(!resp.ok)throw new Error('API returned '+resp.status);
      if(onChunk){
        const reader=resp.body.getReader();const dec=new TextDecoder();let full='';
        while(true){
          const{done,value}=await reader.read();if(done)break;
          const chunk=dec.decode(value);const lines=chunk.split('\n').filter(l=>l.trim());
          for(const line of lines){try{const j=JSON.parse(line);const content=j.choices?.[0]?.delta?.content||j.content||'';full+=content;onChunk(full);}catch(e){full+=line;onChunk(full);}}
        }
        return full;
      }else{
        const d=await resp.json();return d.content||'';
      }
    }catch(e){if(e.name!=='AbortError')throw e;return null;}
  },

  async generate(prompt,lang,onChunk){
    return this.chat([{role:'user',content:prompt}],lang,onChunk);
  },

  stop(){if(this.abortCtrl)this.abortCtrl.abort();}
};

/* Simple markdown to HTML */
function mdToHtml(t){
  if(!t)return'';
  return t
    .replace(/### (.*)/g,'<h4>$1</h4>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/^- (.*)/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
    .replace(/^\d+\. (.*)/gm,'<li>$1</li>')
    .replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>')
    .replace(/^/,'<p>').replace(/$/,'</p>')
    .replace(/<p><\/p>/g,'').replace(/<p>(<h4>)/g,'$1').replace(/(<\/h4>)<\/p>/g,'$1')
    .replace(/<p>(<ul>)/g,'$1').replace(/(<\/ul>)<\/p>/g,'$1');
}

async function generateAIQuiz(){
  const level = document.getElementById('quizLevel').value;
  state.aiLoading = true;
  render();

  const prompt = `Generate a 5-question multiple choice quiz for a ${LANGUAGES[state.lang].name} learner at level ${level}.
  Return ONLY a JSON array of objects with this structure:
  [{"question": "string", "options": ["A", "B", "C", "D"], "answer": index_of_correct_option, "explanation": "why"}]
  The questions should cover vocabulary, grammar, and particles relevant to level ${level}.`;

  try {
    const response = await ai.generate(prompt, LANGUAGES[state.lang]);
    // Try to extract JSON if there's markdown around it
    const jsonStr = response.match(/\[.*\]/s)?.[0] || response;
    state.practiceQuiz = JSON.parse(jsonStr);
    state.practiceIdx = 0;
    state.practiceScore = 0;
    state.practiceSelected = null;
  } catch (e) {
    showToast('Failed to generate quiz. Check AI connection.', 'error');
  }
  state.aiLoading = false;
  render();
}

function handleQuizAnswer(idx){
  state.practiceSelected = idx;
  if(idx === state.practiceQuiz[state.practiceIdx].answer){
    state.practiceScore++;
    addXP(10);
  }
  render();
}

function nextQuizQuestion(){
  if(state.practiceIdx < state.practiceQuiz.length - 1){
    state.practiceIdx++;
    state.practiceSelected = null;
    render();
  } else {
    showToast(`Quiz Complete! Scored ${state.practiceScore}/${state.practiceQuiz.length}`, 'success');
    addXP(50);
    state.practiceQuiz = null;
    render();
  }
}

function renderMemory(l){
  if(!state.memoryCards){

    pool.forEach(v => {
      cards.push({id:v.word, type:'word', val:v.word, revealed:false, matched:false});
      cards.push({id:v.word, type:'mean', val:v.meaning, revealed:false, matched:false});
    });
    state.memoryCards = cards.sort(()=>Math.random()-0.5);
    state.memorySelected = [];
  }

  return `<div class="fade-in">
    <h2 style="font-size:24px;font-weight:900;margin-bottom:4px;">Memory Match</h2>
    <p style="color:var(--muted);font-size:12px;margin-bottom:20px;">Match the word to its meaning.</p>
    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;">
      ${state.memoryCards.map((c, i)=>`
      <div class="memory-card ${c.revealed?'revealed':''} ${c.matched?'matched':''}" onclick="handleMemoryClick(${i})">
        <div class="memory-hidden"><i class="fas fa-question" style="opacity:0.2;"></i></div>
        <div class="memory-content">${c.val}</div>
      </div>`).join('')}
    </div>
    <button class="nav-arrow" style="width:100%;margin-top:24px;" onclick="state.memoryCards=null;render()">Reset Game</button>
  </div>`;
}

function handleMemoryClick(i){
  const cards = state.memoryCards;
  if(cards[i].revealed || cards[i].matched || state.memorySelected.length === 2) return;

  cards[i].revealed = true;
  state.memorySelected.push(i);
  render();

  if(state.memorySelected.length === 2){
    const [i1, i2] = state.memorySelected;
    if(cards[i1].id === cards[i2].id){
      cards[i1].matched = true;
      cards[i2].matched = true;
      state.memorySelected = [];
      addXP(15);
      if(cards.every(c=>c.matched)){
        showToast('You matched everything!', 'success');
        addXP(50);
      }
      render();
    } else {
      setTimeout(()=>{
        cards[i1].revealed = false;
        cards[i2].revealed = false;
        state.memorySelected = [];
        render();
      }, 1000);
    }
  }
}

function renderSpeed(l){
  if(!state.speedActive){
    return `<div class="fade-in" style="text-align:center;padding:40px 0;">
      <i class="fas fa-bolt" style="font-size:64px;color:var(--accent2);margin-bottom:20px;"></i>
      <h2 style="font-size:28px;font-weight:900;margin-bottom:12px;">Speed Round</h2>
      <p style="color:var(--muted);margin-bottom:24px;">How many translations can you get right in 30 seconds?</p>
      <button class="ai-send" style="width:auto;padding:0 40px;background:var(--accent2);" onclick="startSpeedRound()">START CHALLENGE</button>
    </div>`;
  }

  const q = state.speedQ;
  return `<div class="fade-in">
    <div class="speed-timer"><div class="speed-timer-fill" style="width:${(state.speedTime/30)*100}%"></div></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:20px;font-weight:700;">
      <span>Score: ${state.speedScore}</span>
      <span>${state.speedTime.toFixed(1)}s</span>
    </div>
    <div class="content-card" style="text-align:center;padding:40px 20px;">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Translate this</div>
      <div style="font-size:32px;font-weight:900;margin-bottom:32px;">${q.word}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        ${q.options.map((opt, i)=>`
        <button class="quiz-option" onclick="handleSpeedAnswer(${i})">${opt}</button>
        `).join('')}
      </div>
    </div>
  </div>`;
}

function startSpeedRound(){
  state.speedActive = true;
  state.speedScore = 0;
  state.speedTime = 30;
  nextSpeedQ();
  render();

  const timer = setInterval(()=>{
    state.speedTime -= 0.1;
    if(state.speedTime <= 0){
      clearInterval(timer);
      state.speedActive = false;
      showToast(`Speed Round Over! Score: ${state.speedScore}`, 'success');
      addXP(state.speedScore * 5);
      render();
    } else {
      const fill = document.querySelector('.speed-timer-fill');
      if(fill) fill.style.width = `${(state.speedTime/30)*100}%`;
    }
  }, 100);
}

function nextSpeedQ(){
  const l = LANGUAGES[state.lang];
  const target = l.vocabulary[Math.floor(Math.random()*l.vocabulary.length)];
  const distractors = l.vocabulary.filter(v=>v.word!==target.word).sort(()=>Math.random()-0.5).slice(0,3).map(v=>v.meaning);
  state.speedQ = {
    word: target.word,
    answer: target.meaning,
    options: [target.meaning, ...distractors].sort(()=>Math.random()-0.5)
  };
}

function handleSpeedAnswer(i){
  if(state.speedQ.options[i] === state.speedQ.answer){
    state.speedScore++;
    addXP(2);
    nextSpeedQ();
    render();
  } else {
    state.speedTime -= 2; // Penalty
    nextSpeedQ();
    render();
  }
}
function renderDictionary(l){
  if(state.dictQuery===undefined) state.dictQuery='';
  const results = state.dictQuery ? l.vocabulary.filter(v=>v.word.includes(state.dictQuery)||v.meaning.toLowerCase().includes(state.dictQuery.toLowerCase())) : l.vocabulary;

  return `<div class="fade-in">
    <h2 style="font-size:24px;font-weight:900;margin-bottom:12px;">Dictionary</h2>
    <div style="margin-bottom:24px;">
      <input type="text" class="dict-input" placeholder="Search words or meanings..." value="${state.dictQuery}"
             oninput="state.dictQuery=this.value;render()">
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      ${results.map(v=>`
      <div class="vocab-card" onclick="speakWord('${v.word.replace(/'/g,"\\'")}','${l.code}',this)">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--accent);">${v.word}</div>
          <div style="font-size:12px;color:var(--muted);">${v.reading} • ${v.type}</div>
          <div style="font-size:14px;margin-top:4px;">${v.meaning}</div>
        </div>
        <i class="fas fa-volume-high" style="color:var(--muted);opacity:0.5;"></i>
      </div>`).join('')}
      ${results.length===0?`<div style="text-align:center;padding:40px;color:var(--muted);">No matches found in the core vocabulary.</div>`:''}
    </div>
  </div>`;
}

function renderStats(l){
  const rk = getRank(save.xp);
  const nx = getNextRank(save.xp);
  const wordsCount = (save.wordsKnown[state.lang]||[]).length;

  return `<div class="fade-in">
    <h2 style="font-size:24px;font-weight:900;margin-bottom:20px;">Progress & Rank</h2>

    <div class="content-card" style="display:flex;align-items:center;gap:24px;padding:32px;">
      <div style="width:100px;height:100px;border-radius:50%;background:${rk.bg};border:2px solid ${rk.color};display:flex;align-items:center;justify-content:center;">
        <i class="fas ${rk.icon}" style="font-size:42px;color:${rk.color};"></i>
      </div>
      <div>
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700;">Current Rank</div>
        <div style="font-size:32px;font-weight:900;color:${rk.color};">${rk.name}</div>
        <div style="font-size:14px;color:var(--fg2);">${save.xp} Total XP</div>
      </div>
    </div>

    ${nx?`
    <div class="content-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;">
        <span>Next Rank: <strong>${nx.name}</strong></span>
        <span style="color:var(--muted);">${nx.minXP - save.xp} XP remaining</span>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${getXPProgress(save.xp)*100}%"></div></div>
    </div>`:''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div class="content-card" style="text-align:center;">
        <div style="font-size:32px;font-weight:900;color:var(--accent3);">${save.streak}</div>
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Day Streak</div>
      </div>
      <div class="content-card" style="text-align:center;">
        <div style="font-size:32px;font-weight:900;color:var(--ai);">${wordsCount}</div>
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;">Words Mastered</div>
      </div>
    </div>

    <div class="content-card">
      <h4 style="font-size:14px;font-weight:700;margin-bottom:16px;">Activity (Last 7 Days)</h4>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;height:60px;padding:0 10px;">
        ${[6,5,4,3,2,1,0].map(d=>{
          const date = new Date(Date.now()-d*864e5).toDateString();
          const active = save.streakDays && save.streakDays.includes(date);
          return `<div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
            <div class="streak-dot ${active?'active':''} ${d===0?'today':''}"></div>
            <span style="font-size:10px;color:var(--muted);">${new Date(date).toLocaleDateString(undefined,{weekday:'short'})[0]}</span>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

function renderAITutor(l){
  return`<div class="fade-in">
    <h2 style="font-size:24px;font-weight:900;">AI Tutor</h2>
    <div class="ai-chat-area" id="aiChatArea">
      ${state.aiChat.map(m=>`<div class="ai-msg ai-msg-${m.role}">${m.role==='assistant'?mdToHtml(m.content):m.content}</div>`).join('')}
      ${state.aiLoading?`<div class="ai-msg ai-msg-assistant ai-typing"><span></span><span></span><span></span></div>`:''}
    </div>
    <div class="ai-input-area">
      <input class="ai-input" id="aiTutorInput" placeholder="Ask about ${l.name}..." onkeydown="if(event.key==='Enter')sendAITutor();">
      <button class="ai-send" onclick="sendAITutor()"><i class="fas fa-paper-plane"></i></button>
    </div></div>`;
}

async function sendAITutor(){
  const input=document.getElementById('aiTutorInput');
  const text=input?.value?.trim();
  if(!text||state.aiLoading||!ai.connected)return;
  state.aiChat.push({role:'user',content:text});
  state.aiLoading=true;input.value='';render();
  try{
    await ai.chat(state.aiChat,LANGUAGES[state.lang],(partial)=>{
      const msgs=document.getElementById('aiChatArea').querySelectorAll('.ai-msg-assistant');
      const last=msgs[msgs.length-1];
      if(last && !last.classList.contains('ai-typing')) last.innerHTML=mdToHtml(partial);
      else {
          const div=document.createElement('div');div.className='ai-msg ai-msg-assistant';
          div.innerHTML=mdToHtml(partial);document.getElementById('aiChatArea').appendChild(div);
      }
    });
  }catch(e){}
  state.aiLoading=false;render();
}

function selectLanguage(k){state.lang=k;state.view='learn';state.module='tutorial';render();}
function goBack(){state.view='select';render();}
function setModule(m){state.module=m;render();}
function tutorialNav(d){const s=LANGUAGES[state.lang].tutorial;state.tutorialStep=Math.max(0,Math.min(s.length-1,state.tutorialStep+d));render();}
function speakWord(t,c,b){if(b){b.classList.add('speaking');const u=speak(t,c);if(u)u.onend=()=>b.classList.remove('speaking');}else speak(t,c);}

let mediaRecorder;
let audioChunks=[];
async function toggleRecording(){
    const btn=document.getElementById('recordBtn');
    const status=document.getElementById('recordStatus');
    if(!mediaRecorder || mediaRecorder.state==='inactive'){
        const stream=await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRecorder=new MediaRecorder(stream);
        mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
        mediaRecorder.onstop=async ()=>{
            const audioBlob=new Blob(audioChunks,{type:'audio/wav'});
            status.textContent='Analyzing...';
            const res=await analyzePronunciation(audioBlob,save.studentId);
            if(res){
                document.getElementById('analysisResult').style.display='block';
                document.getElementById('accuracyVal').textContent=Math.round(res.pronunciation_score*100)+'%';
                document.getElementById('stressVal').textContent=res.stress_level;
                document.getElementById('transcriptionVal').textContent=res.transcription;
            }
            status.textContent='Click to start recording';
            audioChunks=[];
        };
        audioChunks=[];
        mediaRecorder.start();
        btn.style.background='var(--fg)';btn.style.color='var(--bg)';
        status.textContent='Recording...';
    }else{
        mediaRecorder.stop();
        btn.style.background='var(--danger)';btn.style.color='white';
    }
}

async function analyzePronunciation(audioFile, studentId) {
    const formData = new FormData();
    formData.append('file', audioFile, 'audio.wav');
    formData.append('student_id', studentId);
    try {
        const response = await fetch('/api/speech/analyze', {method: 'POST', body: formData});
        if (response.ok) return await response.json();
    } catch (error) {
        showToast('Speech analysis failed', 'error');
    }
}

ai.testConnection().then(()=>render());
render();
</script>
